name: 'Build Python Package'
description: 'Build Python distribution packages (wheel and source tarball)'
inputs:
  python-version:
    description: 'Python version to use for building'
    required: false
    default: '3.x'
  upload-artifact:
    description: 'Whether to upload the built packages as artifacts'
    required: false
    default: 'false'
  artifact-name:
    description: 'Name for the uploaded artifact'
    required: false
    default: 'python-package-distributions'
  build-backend:
    description: 'Build backend to use (build, hatch, etc.)'
    required: false
    default: 'build'

outputs:
  dist-path:
    description: 'Path to the built distribution packages'
    value: 'dist/'

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install build backend
      shell: bash
      env:
        BUILD_BACKEND: ${{ inputs.build-backend }}
      run: |
        # Intentionally unquoted so more than one backend can be passed.
        python3 -m pip install $BUILD_BACKEND --user

    - name: Build distribution packages
      shell: bash
      run: |
        python3 -m build

    - name: Upload distribution packages
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/
